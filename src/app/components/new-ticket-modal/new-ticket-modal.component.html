<div class="overlay open" (click)="cerrar.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>&gt; Nuevo ticket</h2>

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="field">
        <label>Título</label>
        <input
          type="text"
          formControlName="titulo"
          placeholder="Ej. Impresora del piso 2 sin conexión de red"
        />
      </div>

      <div class="field">
        <label>Descripción del problema</label>
        <textarea
          formControlName="descripcion"
          placeholder="Detalla el problema: qué pasó, cuándo, qué mensaje de error, a quién afecta..."
        ></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Categoría</label>
          <select formControlName="categoria">
            @for (c of categorias; track c.value) {
              <option [value]="c.value">{{ c.label }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Prioridad</label>
          <select formControlName="prioridad">
            @for (p of prioridades; track p.value) {
              <option [value]="p.value">{{ p.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field">
        <label>Solicitante (opcional)</label>
        <input type="text" formControlName="solicitante" placeholder="Nombre de quien reporta" />
      </div>

      @if (form.invalid && (form.touched || form.dirty)) {
        <div class="err">El título y la descripción son obligatorios.</div>
      }
      @if (error()) {
        <div class="err">{{ error() }}</div>
      }

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="guardando()">
          {{ guardando() ? 'Guardando...' : 'Guardar ticket' }}
        </button>
      </div>
    </form>
  </div>
</div>

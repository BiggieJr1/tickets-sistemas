<div class="overlay open" (click)="cerrar.emit()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" (click)="$event.stopPropagation()">
    <h2 id="modal-titulo">&gt; Nuevo ticket</h2>

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="field">
        <label for="f-titulo">Título</label>
        <input
          #primerCampo
          id="f-titulo"
          type="text"
          formControlName="titulo"
          placeholder="Ej. Impresora del piso 2 sin conexión de red"
        />
      </div>

      <div class="field">
        <label for="f-descripcion">Descripción del problema</label>
        <textarea
          id="f-descripcion"
          formControlName="descripcion"
          placeholder="Detalla el problema: qué pasó, cuándo, qué mensaje de error, a quién afecta..."
        ></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-categoria">Categoría</label>
          <select id="f-categoria" formControlName="categoria">
            @for (c of categorias; track c.value) {
              <option [value]="c.value">{{ c.label }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="f-prioridad">Prioridad</label>
          <select id="f-prioridad" formControlName="prioridad">
            @for (p of prioridades; track p.value) {
              <option [value]="p.value">{{ p.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field">
        <label for="f-solicitante">Solicitante (opcional)</label>
        <input id="f-solicitante" type="text" formControlName="solicitante" placeholder="Nombre de quien reporta" />
      </div>

      @if (form.invalid && (form.touched || form.dirty)) {
        <div class="err" role="alert">El título y la descripción son obligatorios.</div>
      }
      @if (error()) {
        <div class="err" role="alert">{{ error() }}</div>
      }

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="guardando()">
          {{ guardando() ? 'Guardando...' : 'Guardar ticket' }}
        </button>
      </div>
    </form>
  </div>
</div>

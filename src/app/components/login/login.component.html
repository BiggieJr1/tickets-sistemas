<div class="login-page">
  <div class="card">
    <h1>&gt; Centro de Tickets — Sistemas</h1>

    @if (auth.error()) {
      <div class="err" role="alert">{{ auth.error() }}</div>
      <button type="button" class="btn-login" (click)="cerrarSesion()">
        Cerrar sesión e intentar con otra cuenta
      </button>
    } @else {
      <button type="button" class="btn-login" [disabled]="auth.loading()" (click)="entrar()">
        {{ auth.loading() ? 'Entrando...' : 'Iniciar sesión con Microsoft' }}
      </button>
    }
  </div>
</div>

<div class="login-page">
  <div class="card">
    <h1>&gt; Centro de Tickets — Sistemas</h1>

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="field">
        <label for="f-email">Correo</label>
        <input
          id="f-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="tu.correo@empresa.com"
        />
      </div>

      <div class="field">
        <label for="f-password">Contraseña</label>
        <input
          id="f-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      @if (form.invalid && (form.touched || form.dirty)) {
        <div class="err" role="alert">Correo y contraseña son obligatorios.</div>
      }
      @if (auth.error()) {
        <div class="err" role="alert">{{ auth.error() }}</div>
      }

      <button type="submit" class="btn-login" [disabled]="auth.loading()">
        {{ auth.loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
